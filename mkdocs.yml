# ====================================================================
#  Konfiguration der Seite. Hier stellst du Titel, Navigation und
#  Aussehen ein. Änderungen wirken beim nächsten "git push" automatisch.
# ====================================================================

site_name: Forschen mit LLMs
site_description: Niederschwelliger Wegweiser, wie LLMs alle Schritte des Forschungsprozesses unterstützen können
site_author: "maxandul"
site_url: https://maxandul.github.io/research-mit-llms/

theme:
  name: material
  language: de
  custom_dir: overrides       # laedt zusaetzlich die Titelschrift, siehe overrides/main.html
  font:
    # Fliesstext: eigens auf Lesbarkeit hin entworfen (Braille Institute).
    # Titelschrift (Source Serif 4) kommt ueber overrides/main.html dazu.
    # Beide werden beim Build lokal abgelegt, siehe privacy-Plugin.
    text: Atkinson Hyperlegible
    code: JetBrains Mono
  features:
    - navigation.tabs         # Hauptbereiche als Reiter in der Kopfzeile
    - navigation.tabs.sticky  # Reiter bleiben beim Scrollen sichtbar
    - navigation.indexes      # jeder Bereich hat eine eigene Startseite
    - navigation.path         # Brotkrumen über dem Seitentitel
    - navigation.prune        # Seitenleiste zeigt nur den aktiven Bereich
    - navigation.tracking     # Adresszeile folgt dem gelesenen Abschnitt
    - navigation.sections     # Gruppen in der Seitenleiste ausklappen
    - navigation.top          # "Nach oben"-Button
    - navigation.instant      # schnelles Navigieren ohne Neuladen
    - navigation.footer       # Vor/Zurück-Links unten
    - search.suggest          # Suchvorschläge
    - search.highlight        # Treffer hervorheben
    - search.share            # Suchergebnis als Link teilen
    - content.code.copy       # Kopier-Knopf bei Code-Boxen
    - toc.follow
  # "custom" heisst: die Farben stehen nicht hier, sondern in
  # docs/assets/stylesheets/tokens.css. Dort ist die einzige Stelle, an
  # der eine Farbe geändert wird.
  palette:
    # Heller Modus
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Zu dunklem Modus wechseln
    # Dunkler Modus
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Zu hellem Modus wechseln

# --------------------------------------------------------------------
#  Eigenes Stylesheet. Reihenfolge zählt: tokens.css definiert die
#  Werte, extra.css wendet sie auf Material an.
# --------------------------------------------------------------------
extra_css:
  - assets/stylesheets/tokens.css
  - assets/stylesheets/extra.css

hooks:
  - tools/wiki_graph.py            # erzeugt graph.json für den Wissensgraphen
  - tools/wiki_komponenten.py      # rendert Notizkopf und Werkzeug-Steckbrief
                                   # aus dem Frontmatter

plugins:
  - search:
      lang: de
  - privacy:                       # lädt externe Schriften beim Build herunter und
      enabled: !ENV [CI, false]    # hostet sie selbst: keine Anfragen an Google beim
                                   # Besuch. Lokal aus, damit der Build schnell bleibt.
  # Weiterleitungen für Seiten, die zusammengelegt oder umbenannt wurden.
  # Alte Adressen bleiben so gültig: Lesezeichen und externe Verweise
  # laufen nicht ins Leere.
  - redirects:
      redirect_maps:
        grundlagen/llm-research.md: grundlagen/llm-einspannen.md
        grundlagen/rag-vs-wiki.md: grundlagen/llm-einspannen.md
        werkzeuge/dialog/notebooklm.md: werkzeuge/dialog/gemini-notebook.md
  - git-revision-date-localized:   # "Zuletzt aktualisiert" pro Seite
      type: date
      locale: de
      fallback_to_build_date: true

markdown_extensions:
  - admonition                # farbige Hinweis-Boxen (!!! note ...)
  - pymdownx.details          # ausklappbare Boxen
  - pymdownx.superfences      # bessere Code-Boxen
  - pymdownx.highlight        # Syntax-Hervorhebung
  - pymdownx.tabbed:          # Reiter (Tabs)
      alternate_style: true
  - attr_list                 # Attribute für Badges
  - md_in_html
  - tables
  - pymdownx.emoji:           # Icons als :material-name: in Karten und Navigation
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

# --------------------------------------------------------------------
#  Navigation: Reihenfolge und Struktur der Seiten.
#  Neue Seite hinzufügen = Markdown-Datei anlegen + hier eintragen.
#
#  Die oberste Ebene sind die Reiter in der Kopfzeile, gegliedert nach
#  Forschungsphase. Der jeweils erste Eintrag eines Reiters ist seine
#  Startseite und trägt das Icon im Frontmatter. Damit navigation.indexes
#  greift, muss diese Startseite eine echte `index.md` in einem eigenen
#  Ordner sein; eine flache Datei erkennt Material nicht als Bereichs-
#  Startseite. Deshalb gibt es literatur/ und daten/ als Ordner, obwohl
#  ihre Unterseiten anderswo liegen (werkzeuge/, workflows/, erheben/,
#  analysieren/).
# --------------------------------------------------------------------
nav:
  - Start: index.md
  - Grundlagen:
      - grundlagen/index.md
      - LLMs verstehen & verantwortungsvoll nutzen: grundlagen/llms-verstehen.md
      - Wie ein LLM arbeitet: grundlagen/wie-llms-arbeiten.md
      - Wie du ein LLM einspannst: grundlagen/llm-einspannen.md
      - Das Kontextfenster: grundlagen/kontextfenster.md
      - Markdown als Arbeitsformat: grundlagen/markdown-arbeitsformat.md
      - Datenschutz & Vertraulichkeit: grundlagen/datenschutz.md
  - Literatur:
      - literatur/index.md
      - Workflows:
          - Vom Thema zur Literaturübersicht: workflows/thema-zu-uebersicht.md
          - Paper lesen & strukturiert ablegen: workflows/paper-lesen-ablegen.md
          - Eigenes Forschungs-Wiki aufbauen: workflows/forschungs-wiki.md
  - Daten:
      - daten/index.md
      - Erheben & schützen:
          - Interviews transkribieren: erheben/transkription.md
          - Daten anonymisieren: erheben/anonymisieren.md
      - Analysieren:
          - Qualitative Daten codieren: analysieren/qualitativ-codieren.md
          - Quantitativ auswerten: analysieren/quantitativ-auswerten.md
  - Schreiben:
      - schreiben/index.md
      - Die Arbeit in Markdown aufbauen: schreiben/arbeit-in-markdown.md
      - Mit Word-Feedback umgehen: schreiben/word-feedback.md
  - Haltung:
      - haltung/index.md
      - KI-Nutzung deklarieren: haltung/ki-deklarieren.md
  - Werkzeuge:
      - werkzeuge/index.md
      - Literatur finden:
          - Semantic Scholar: werkzeuge/finden/semantic-scholar.md
          - Connected Papers: werkzeuge/finden/connected-papers.md
          - Elicit: werkzeuge/finden/elicit.md
      - Literatur befragen:
          - ScholarAI: werkzeuge/dialog/scholarai.md
          - Gemini Notebook: werkzeuge/dialog/gemini-notebook.md
          - Perplexity: werkzeuge/dialog/perplexity.md
      - Sammeln und verwalten:
          - Zotero: werkzeuge/sammeln/zotero.md
          - Notion: werkzeuge/sammeln/notion.md
          - LLM-Wiki (nach Karpathy): werkzeuge/sammeln/llm-wiki.md
      - Transkribieren:
          - TranscriboZH: werkzeuge/transkribieren/transcribozh.md
          - noScribe: werkzeuge/transkribieren/noscribe.md
          - MacWhisper: werkzeuge/transkribieren/macwhisper.md
          - Teams und Google Meet: werkzeuge/transkribieren/online-meetings.md
      - Daten analysieren:
          - MAXQDA: werkzeuge/analysieren/maxqda.md
          - ATLAS.ti: werkzeuge/analysieren/atlasti.md
      - Schreiben und exportieren:
          - Pandoc: werkzeuge/schreiben/pandoc.md
          - Quarto: werkzeuge/schreiben/quarto.md
      - Lokal betreiben:
          - Ollama und LM Studio: werkzeuge/lokal/ollama-lmstudio.md
      - Agentisch arbeiten:
          - Coding-Agenten: werkzeuge/agenten/coding-agenten.md
      - Weitere Tools im Überblick: werkzeuge/weitere-tools.md
  - Forschungsstand:
      - wiki/index.md
      - Synthesen:
          - LLMs verstehen (Grundhaltung): wiki/synthese/llms-verstehen.md
          - KI-Nutzung deklarieren: wiki/synthese/ki-deklarieren.md
          - Qualitative Daten codieren: wiki/synthese/qualitativ-codieren.md
      - Konzeptnotizen: wiki/konzepte/index.md
      - Quellnotizen: wiki/quellen/index.md
  - Ressourcen:
      - ressourcen/index.md
      - Glossar: ressourcen/glossar.md
      - Linksammlung: ressourcen/links.md
      - Prompt-Bibliothek: ressourcen/prompt-bibliothek.md
      - Wiki-Vorlagen: ressourcen/wiki-vorlagen.md
      - Changelog: ressourcen/changelog.md
      - Über diese Website: ueber.md

# --------------------------------------------------------------------
#  Statusmarken: kommen aus dem Frontmatter der Wiki-Notizen (Feld
#  `status`, siehe CLAUDE.md). Das Feld wird nur bei vorläufigen oder
#  überholten Notizen gesetzt; fehlt es, gilt die Notiz als geprüft und
#  bekommt keine Marke.
# --------------------------------------------------------------------
extra:
  status:
    draft: Vorläufig, nur Abstract geprüft
    deprecated: Überholt, wird nicht mehr gepflegt
