      - Drei Arten, LLMs zu nutzen: grundlagen/llm-research.md
      - Kontext, RAG & LLM-Wiki: grundlagen/rag-vs-wiki.md
      - Das Kontextfenster: grundlagen/kontextfenster.md
      - Markdown als Arbeitsformat: grundlagen/markdown-arbeitsformat.md
      - Datenschutz & Vertraulichkeit: grundlagen/datenschutz.md
  - Literatur:
      - Finden & Erkunden:
          - Semantic Scholar: werkzeuge/finden/semantic-scholar.md
          - Connected Papers: werkzeuge/finden/connected-papers.md
          - Elicit: werkzeuge/finden/elicit.md
      - Im Dialog recherchieren:
          - ScholarAI (Custom GPT): werkzeuge/dialog/scholarai.md
          - NotebookLM: werkzeuge/dialog/notebooklm.md
          - Perplexity: werkzeuge/dialog/perplexity.md
      - Sammeln & Synthetisieren:
          - Zotero: werkzeuge/sammeln/zotero.md
          - Notion: werkzeuge/sammeln/notion.md
          - LLM-Wiki (nach Karpathy): werkzeuge/sammeln/llm-wiki.md
      - Weitere Tools im Überblick: werkzeuge/weitere-tools.md
      - Workflows:
          - Vom Thema zur Literaturübersicht: workflows/thema-zu-uebersicht.md
          - Paper lesen & strukturiert ablegen: workflows/paper-lesen-ablegen.md
          - Eigenes Forschungs-Wiki aufbauen: workflows/forschungs-wiki.md
  - Daten erheben & schützen:
      - Interviews transkribieren: erheben/transkription.md
      - Daten anonymisieren: erheben/anonymisieren.md
  - Daten analysieren:
      - Qualitative Daten codieren: analysieren/qualitativ-codieren.md
      - Quantitativ auswerten: analysieren/quantitativ-auswerten.md
  - Schreiben & Publizieren:
      - Die Arbeit in Markdown aufbauen: schreiben/arbeit-in-markdown.md
      - Mit Word-Feedback umgehen: schreiben/word-feedback.md
  - Haltung & gute Praxis:
      - KI-Nutzung deklarieren: haltung/ki-deklarieren.md
  - Forschungsstand:
      - Über dieses Wiki: wiki/index.md
      - Synthesen:
          - LLMs verstehen (Grundhaltung): wiki/synthese/llms-verstehen.md
          - KI-Nutzung deklarieren: wiki/synthese/ki-deklarieren.md
          - Qualitative Daten codieren: wiki/synthese/qualitativ-codieren.md
      - Konzeptnotizen: wiki/konzepte/index.md
      - Quellnotizen: wiki/quellen/index.md
  - Ressourcen:
      - Glossar: ressourcen/glossar.md
      - Linksammlung: ressourcen/links.md
      - Prompt-Bibliothek: ressourcen/prompt-bibliothek.md
      - Wiki-Vorlagen: ressourcen/wiki-vorlagen.md
      - Changelog: ressourcen/changelog.md
  - Über: ueber.md
